# One command starts the whole Magic Tree:  docker compose up --build
services:
  web:
    build: ./web
    ports:
      - "3000:80"          # http://localhost:3000
    depends_on:
      - api

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://magic:magic@db:5432/magictree?sslmode=disable   # "db" = the service name
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magic
      POSTGRES_PASSWORD: magic
      POSTGRES_DB: magictree
    volumes:
      - tree-data:/var/lib/postgresql/data          # data survives restarts
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d magictree"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  tree-data:
