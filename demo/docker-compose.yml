# web + api + db on one network: docker compose up --build
services:
  web:
    build: ./web
    ports:
      - "3000:80"          # http://localhost:3000
    networks:
      - tree
    depends_on:
      - api

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://magic:magictree@db:5432/treedb?sslmode=disable   # "db" = the service name
    depends_on:
      db:
        condition: service_healthy     # wait until Postgres accepts connections
    networks:
      tree:
        aliases:
          - api            # other containers on "tree" can reach this one as http://api:8080
    # no "ports:" any more: only the web container needs to be reachable from the laptop

  db:
    image: postgres:18-alpine3.24
    environment:
      POSTGRES_USER: magic
      POSTGRES_PASSWORD: magictree
      POSTGRES_DB: treedb
    volumes:
      - tree-data:/var/lib/postgresql          # named volume: the data outlives the container
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # creates the tables and seeds ten gardens on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d treedb"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - tree

networks:
  tree:

volumes:
  tree-data:
