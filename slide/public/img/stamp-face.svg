<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <g id="tree">
      <path d="M-4 36 C-4 22 -5 11 -10 0 L10 0 C5 11 4 22 4 36 Z"/>
      <circle cx="0" cy="-22" r="18"/><circle cx="-16" cy="-8" r="13"/><circle cx="16" cy="-8" r="13"/>
      <circle cx="-9" cy="-31" r="11"/><circle cx="10" cy="-32" r="11"/><circle cx="0" cy="-5" r="12"/>
    </g>
    <radialGradient id="wax" cx=".3" cy=".25" r=".95">
      <stop offset="0" stop-color="#34425e"/><stop offset=".45" stop-color="#18202f"/><stop offset="1" stop-color="#080b12"/>
    </radialGradient>
    <radialGradient id="waxIn" cx=".4" cy=".35" r=".9">
      <stop offset="0" stop-color="#1b2332"/><stop offset="1" stop-color="#0b0f18"/>
    </radialGradient>
    <radialGradient id="brass" cx=".3" cy=".25" r=".95">
      <stop offset="0" stop-color="#f6dc8a"/><stop offset=".4" stop-color="#d9a838"/><stop offset=".8" stop-color="#a97a22"/><stop offset="1" stop-color="#7a5415"/>
    </radialGradient>
    <linearGradient id="brassSide" x1="0" x2="1">
      <stop offset="0" stop-color="#8a6118"/><stop offset=".3" stop-color="#e6bb55"/><stop offset=".55" stop-color="#b98a2a"/><stop offset="1" stop-color="#6c4a10"/>
    </linearGradient>
    <linearGradient id="bulb" x1="0" x2="1">
      <stop offset="0" stop-color="#7a5415"/><stop offset=".3" stop-color="#f3d27a"/><stop offset=".6" stop-color="#c8962f"/><stop offset="1" stop-color="#6c4a10"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#0f0805"/><stop offset=".28" stop-color="#4b2c1d"/><stop offset=".42" stop-color="#2a170e"/><stop offset="1" stop-color="#0c0603"/>
    </linearGradient>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur6" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="brush" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".6 .015" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 0  0 0 0 .9 -.25"/>
    </filter>
    <clipPath id="faceClip"><ellipse cx="0" cy="0" rx="62" ry="48"/></clipPath>
  </defs>

  <!-- ===== wax seal impression ===== -->
  <ellipse cx="134" cy="262" rx="104" ry="14" fill="#000" opacity=".22" filter="url(#blur6)"/>
  <path d="M26 176 C22 118 78 96 140 104 C204 112 238 150 230 202 C222 252 160 282 98 270 C48 260 28 226 26 176 Z" fill="url(#wax)"/>
  <path d="M40 150 C52 118 92 104 136 110" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".38" filter="url(#blur2)"/>
  <path d="M215 238 C190 262 150 272 110 268" fill="none" stroke="#8aa0c8" stroke-width="3" stroke-linecap="round" opacity=".25" filter="url(#blur2)"/>
  <ellipse cx="130" cy="188" rx="84" ry="70" fill="url(#waxIn)" stroke="#000" stroke-opacity=".6" stroke-width="2"/>
  <ellipse cx="131" cy="189" rx="84" ry="70" fill="none" stroke="#5a6b8c" stroke-opacity=".45" stroke-width="1.5"/>
  <ellipse cx="130" cy="188" rx="72" ry="59" fill="none" stroke="#2c3750" stroke-width="2"/>
  <g transform="translate(130 190) scale(1.15)">
    <use href="#tree" transform="translate(1.5 2)" fill="#000" opacity=".7"/>
    <use href="#tree" fill="#3a4a68"/>
  </g>

  <!-- ===== stamp ===== -->
  <ellipse cx="318" cy="276" rx="66" ry="10" fill="#000" opacity=".25" filter="url(#blur6)"/>
  <g transform="translate(300 190) rotate(9) scale(.8)">
    <!-- dark hardwood handle -->
    <path d="M-17 -34 C-15 -58 -13 -76 -14 -96 C-15 -116 -25 -130 -25 -154 C-25 -176 -17 -190 -13 -204 L13 -204 C17 -190 25 -176 25 -154 C25 -130 15 -116 14 -96 C13 -76 15 -58 17 -34 Z" fill="url(#wood)"/>
    <path d="M-15 -150 C-15 -170 -10 -186 -8 -198" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".22" filter="url(#blur2)"/>
    <path d="M-9 -94 C-10 -76 -9 -58 -8 -40" fill="none" stroke="#c9936a" stroke-width="2" stroke-linecap="round" opacity=".25" filter="url(#blur2)"/>
    <ellipse cx="0" cy="-204" rx="13" ry="4" fill="#1a0e08"/>
    <!-- brass ball collar -->
    <path d="M-12 -30 C-12 -38 -9 -42 -9 -46 L9 -46 C9 -42 12 -38 12 -30 Z" fill="url(#bulb)"/>
    <ellipse cx="0" cy="-22" rx="31" ry="21" fill="url(#bulb)"/>
    <path d="M-20 -32 C-14 -40 -2 -42 8 -40" fill="none" stroke="#fff6cf" stroke-width="3" stroke-linecap="round" opacity=".6" filter="url(#blur2)"/>
  </g>
  <!-- brass disc: thickness then engraved face -->
  <g transform="translate(300 208) rotate(-12)">
    <path d="M-62 0 L-62 20 C-62 46 62 46 62 20 L62 0 Z" fill="url(#brassSide)"/>
    <ellipse cx="0" cy="20" rx="62" ry="48" fill="url(#brassSide)" opacity="0"/>
    <path d="M-62 20 C-62 46 62 46 62 20" fill="none" stroke="#5a3d0c" stroke-width="1.4"/>
    <ellipse cx="0" cy="0" rx="62" ry="48" fill="url(#brass)" stroke="#6c4a10" stroke-width="1.4"/>
    <g clip-path="url(#faceClip)"><rect x="-62" y="-48" width="124" height="96" filter="url(#brush)" opacity=".5"/></g>
    <ellipse cx="0" cy="0" rx="55" ry="42" fill="none" stroke="#fff3c4" stroke-width="1.4" opacity=".55"/>
    <ellipse cx="0" cy="0" rx="52" ry="39" fill="none" stroke="#7a5415" stroke-width="1.2" opacity=".6"/>
    <g transform="scale(-.62 .62) translate(0 6)">
      <use href="#tree" transform="translate(2 2.5)" fill="#fff0b8" opacity=".7"/>
      <use href="#tree" fill="#2e1c08"/>
    </g>
    <path d="M-48 -22 C-36 -38 -14 -44 10 -43" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".35" filter="url(#blur2)"/>
  </g>
</svg>
