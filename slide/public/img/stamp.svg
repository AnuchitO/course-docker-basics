<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <defs>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4a2a12"/><stop offset=".25" stop-color="#8a5326"/>
      <stop offset=".5" stop-color="#b87a3e"/><stop offset=".78" stop-color="#7a4620"/><stop offset="1" stop-color="#3b200d"/>
    </linearGradient>
    <radialGradient id="knob" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#d9a066"/><stop offset=".45" stop-color="#a26a32"/><stop offset="1" stop-color="#4a2a12"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4b5563"/><stop offset=".18" stop-color="#cfd6de"/><stop offset=".38" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#9aa4b0"/><stop offset=".85" stop-color="#e3e8ee"/><stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="steelTop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#8f99a6"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="232" rx="62" ry="9" fill="#000" opacity=".18"/>
  <!-- steel head: knurled cylinder -->
  <path d="M56 186 L56 214 C56 224 144 224 144 214 L144 186 Z" fill="url(#steel)"/>
  <g stroke="#5b6573" stroke-width="1.2" opacity=".55">
    <line x1="66" y1="190" x2="66" y2="219"/><line x1="76" y1="190" x2="76" y2="221"/><line x1="86" y1="190" x2="86" y2="222"/>
    <line x1="96" y1="190" x2="96" y2="222"/><line x1="106" y1="190" x2="106" y2="222"/><line x1="116" y1="190" x2="116" y2="222"/>
    <line x1="126" y1="190" x2="126" y2="221"/><line x1="136" y1="190" x2="136" y2="219"/>
  </g>
  <ellipse cx="100" cy="186" rx="44" ry="11" fill="url(#steelTop)"/>
  <ellipse cx="100" cy="186" rx="44" ry="11" fill="none" stroke="#6b7684" stroke-width="1.4"/>
  <!-- steel collar -->
  <path d="M72 168 L72 186 C72 194 128 194 128 186 L128 168 Z" fill="url(#steel)"/>
  <ellipse cx="100" cy="168" rx="28" ry="7" fill="url(#steelTop)" stroke="#6b7684" stroke-width="1"/>
  <!-- turned hardwood handle -->
  <path d="M84 70 C86 98 80 112 78 130 C77 146 72 156 72 166 C72 172 128 172 128 166 C128 156 123 146 122 130 C120 112 114 98 116 70 Z" fill="url(#wood)"/>
  <g fill="none" stroke="#3b200d" stroke-width="1.6" opacity=".55">
    <path d="M80 112 C95 118 105 118 120 112"/><path d="M78 124 C94 131 106 131 122 124"/>
    <path d="M75 146 C93 153 107 153 125 146"/>
  </g>
  <g fill="none" stroke="#f0c48e" stroke-width="1" opacity=".35">
    <path d="M94 76 C96 100 92 120 92 160"/><path d="M104 76 C106 100 103 120 103 160"/>
  </g>
  <!-- knob -->
  <ellipse cx="100" cy="48" rx="36" ry="30" fill="url(#knob)"/>
  <path d="M78 40 C84 30 96 26 108 28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".28"/>
  <g fill="none" stroke="#3b200d" stroke-width="1" opacity=".3">
    <path d="M70 52 C82 62 118 62 130 52"/><path d="M76 40 C88 48 112 48 124 40"/>
  </g>
